name: MorBok AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Backend Testing & Linting
  # =========================================================================
  backend-test:
    name: 🐍 Backend Test & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-thai-tlwg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Architecture Validation Tests
        env:
          PYTHONPATH: ./backend
        run: |
          cd backend
          python test_all_models.py

  # =========================================================================
  # JOB 2: Frontend Typecheck & Production Build
  # =========================================================================
  frontend-build:
    name: ⚡ Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_HOST: localhost:8080
        run: npm run build

  # =========================================================================
  # JOB 3: Docker Image Build & Validation
  # =========================================================================
  docker-build:
    name: 🐳 Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t morbok-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t morbok-frontend:latest ./frontend

  # =========================================================================
  # JOB 4: Deployment Readiness (Staging / Production)
  # =========================================================================
  deploy:
    name: 🚀 Deploy Staging / Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Health & Smoke Check
        run: |
          echo "✅ All CI/CD checks passed successfully!"
          echo "🚀 MorBok AI System ready for automated staging/production deployment."

services:
  postgres:
    image: postgres:16-alpine
    container_name: pvs_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pvs_db}
      POSTGRES_USER: ${POSTGRES_USER:-pvs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pvs_redis
    restart: always
    ports:
      - "6379:6379"

  fastapi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pvs_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pvs_admin}:${POSTGRES_PASSWORD:-SecretPassword123}@postgres:5432/${POSTGRES_DB:-pvs_db}
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - OPENROUTER_PROVIDER=${OPENROUTER_PROVIDER:-google-vertex}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
    depends_on:
      - redis

  nextjs-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pvs_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_HOST=localhost:8080

volumes:
  pgdata:

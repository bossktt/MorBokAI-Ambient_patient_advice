<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 109, 51, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 109, 51, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 109, 51, 0); }
        }

<body class="bg-surface text-on-surface font-body-md h-full flex flex-col items-center antialiased selection:bg-primary-fixed selection:text-on-primary-fixed pt-safe-top">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flat no shadows flex justify-between items-center px-margin-mobile h-14 max-w-max-width-mobile mx-auto z-40 transition-shadow">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="medical_services">medical_services</span>
<span class="font-headline-md text-headline-md font-bold text-primary">MorBok</span>
</div>
<button aria-label="Close" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Canvas: Verify PIN -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-max-width-mobile mx-auto px-margin-mobile py-lg pb-safe-bottom relative">
<!-- Status Indicator -->
<div class="absolute top-lg flex flex-col items-center justify-center w-full max-w-max-width-mobile left-0 px-margin-mobile">
<div class="inline-flex items-center gap-sm bg-secondary-container text-on-secondary-container px-md py-sm rounded-full font-label-bold text-label-bold pulse-ring shadow-sm border border-secondary-fixed">
<span class="w-2 h-2 rounded-full bg-secondary block"></span>
                Waiting for connection...
            </div>
</div>
<!-- Connection Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(0,51,102,0.08)] p-lg flex flex-col items-center mt-xl relative overflow-hidden">
<!-- Logo Decoration -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-fixed opacity-20 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-secondary-container opacity-20 rounded-full blur-2xl pointer-events-none"></div>
<div class="w-24 h-24 rounded-full overflow-hidden border-4 border-surface shadow-md mb-lg z-10 bg-white">
<img alt="LINE OA Profile Icon" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxpND__Kuq9KYqbARGpyVgMOS0IkqLXSGFDqm7rKe5apI5q-WZn9IYcXT--6puYi2HMPqMLvQYFzFDJ0DQZpMdrGj63qOcunbmjtHetyl3f973Q2gT_a6uydiXezlpa8434PvbAWbzKD4rxnzx0wV0CIcL5lj_2HBRZDc-f847P4VhzOjm71lFFsZYsrio8YjcWqZBKC-u5EOmDs-OvflMm3knFDQH7WwVoX4-ZRTebNHFroNrEpt2CWdqjCWTC6WSgy8"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center mb-xs z-10">Link Your Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-xl z-10">
                Enter this 6-digit PIN in the MorBok LINE Official Account to verify your identity.
            </p>
<!-- PIN Display -->
<div class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-md flex items-center justify-center mb-lg z-10 group cursor-default">
<div class="flex gap-sm">
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">4</span>
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">8</span>
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">1</span>
<span class="w-4 flex items-center justify-center text-outline-variant font-bold">-</span>
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">9</span>
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">0</span>
<span class="w-12 h-14 flex items-center justify-center bg-surface-container-lowest border border-outline-variant rounded text-headline-lg-mobile font-headline-lg-mobile text-primary font-bold shadow-sm">2</span>
</div>
</div>
<!-- Timer / Expiry -->
<div class="flex items-center gap-xs text-on-surface-variant font-body-sm text-body-sm z-10">
<span class="material-symbols-outlined text-[16px]" data-icon="timer">timer</span>
<span>Code expires in <span class="font-label-bold text-label-bold text-primary">04:59</span></span>
</div>
<button class="mt-lg w-full flex items-center justify-center gap-xs py-md px-lg rounded-lg border border-primary text-primary font-label-bold text-label-bold hover:bg-surface-container-low active:scale-[0.98] transition-all z-10">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                Generate New Code
            </button>
</div>
<!-- Bottom Action (Optional Help) -->
<div class="mt-auto pt-lg text-center w-full">
<a class="inline-flex items-center gap-xs font-label-bold text-label-bold text-surface-tint hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="help">help</span>
                Need help connecting?
            </a>
</div>
</main>
<!-- BottomNavBar suppressed due to linear/transactional intent (Verify PIN) -->
</body></html>

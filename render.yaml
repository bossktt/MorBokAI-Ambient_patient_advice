# Render Blueprint — MorBok FastAPI Backend
# Deploy: render.com → New → Blueprint → select this repo
# (or paste this file's service manually)

services:
  - type: web
    name: morbok-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEFAULT_LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_PROVIDER
        value: google-vertex
      - key: OPENROUTER_ASR_MODEL
        value: x-ai/grok-stt-1.0
      - key: OPENROUTER_ASR_VERIFIER_MODEL
        value: openai/whisper-large-v3-turbo
      - key: ASR_MIN_MODEL_AGREEMENT
        value: "0.85"
      - key: ASR_MIN_DICTIONARY_COVERAGE
        value: "0.4"
      - key: OPENROUTER_ASR_TEMPERATURE
        value: "0"
      - key: ASR_DOMAIN_PROMPT
        value: "คำแนะนำทางการแพทย์ ห้องฉุกเฉิน ประเทศไทย Metformin Amlodipine Paracetamol Cetirizine Loratadine มิลลิกรัม เม็ด รับประทาน ก่อนนอน หลังอาหาร เช้า เย็น นัดติดตามอาการ"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
